<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>見出し</h1>
    <p>ここを書き換えます</p>

    <button onclick="action()">
        文字を書き換える
    </button>

    <script>
        // function-action(){
        // [植田]　functionとactionの間は半角の空白です。　見にくかったかもしれません。
        function action(){
            document.querySelector("p").textContent = "ここを書き換えました"
        }
    </script>
</body>
</html>
